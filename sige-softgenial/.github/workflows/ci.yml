# ============================================================================
# SIGE SoftGenial - CI de release
# Em cada push/PR: lint integral + gates vivos. Em tag v*: gera o ZIP
# instalável como artefacto, já com o nome certo. Elimina a classe de erros
# "ZIP novo com header antigo": o gate compara as 3 fontes de versão.
# ============================================================================
name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']   # piso pretendido + versão da VPS
    steps:
      - uses: actions/checkout@v4

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli

      - name: Lint integral
        run: |
          ERRO=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "LINT FALHOU: $f"; ERRO=1; }
          done < <(find . -name "*.php" -not -path "./docs/*")
          exit $ERRO

      - name: Release gate (estrutura, copy, versão sincronizada)
        run: php tools/smoke-release-gate.php

      - name: Pacote de regressão funcional
        run: php tools/smoke-regression-pack.php

      - name: Escudo de login (testes funcionais)
        run: php tools/smoke-login-shield.php

  zip:
    needs: qualidade
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar tag = versão do plugin
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          HDR=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9.]+' sige-softgenial.php)
          [ "$TAG" = "$HDR" ] || { echo "Tag v$TAG difere do header $HDR"; exit 1; }
      - name: Gerar ZIP instalável
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          mkdir -p /tmp/pkg && cp -r . /tmp/pkg/sige-softgenial
          rm -rf /tmp/pkg/sige-softgenial/.git /tmp/pkg/sige-softgenial/.github
          cd /tmp/pkg && zip -qr "sige-softgenial-v${TAG}.zip" sige-softgenial
          echo "ZIP=/tmp/pkg/sige-softgenial-v${TAG}.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: sige-softgenial-zip
          path: ${{ env.ZIP }}
          retention-days: 90
