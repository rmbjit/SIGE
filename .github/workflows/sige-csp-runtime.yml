name: SIGE CSP runtime audit

on:
  push:
    branches:
      - SIGE-Mozambique
    paths:
      - .github/workflows/sige-csp-runtime.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: sige-csp-runtime-authenticated
  cancel-in-progress: true

jobs:
  authenticated-csp-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIGE_BASE_URL: https://teste.softgenial.edu.mz
      SIGE_CSP_OUTPUT: ${{ github.workspace }}/artifacts
      SIGE_CSP_SETTLE_MS: '1200'
      SIGE_CSP_NAV_TIMEOUT_MS: '45000'
      SIGE_ADMIN_USER: ${{ secrets.SIGE_STAGING_USER }}
      SIGE_ADMIN_PASS: ${{ secrets.SIGE_STAGING_PASS }}
    steps:
      - name: Checkout executor
        uses: actions/checkout@v4

      - name: Announce authenticated run
        id: announce
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="SIGE-CSP-RUNTIME-RUN-${GITHUB_RUN_ID}"
          body="$(cat <<EOF
          Auditoria autenticada CSP da Fase 10.

          - Run: ${GITHUB_RUN_ID}
          - Attempt: ${GITHUB_RUN_ATTEMPT}
          - Commit: ${GITHUB_SHA}
          - Staging: https://teste.softgenial.edu.mz
          - Matriz: 60 vistas em cold cache + 60 vistas em warm cache
          - Credenciais: GitHub Actions secrets, nunca incluídas em logs ou artefactos
          EOF
          )"
          payload="$(jq -n --arg title "$title" --arg body "$body" '{title:$title,body:$body}')"
          response="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d "$payload")"
          issue_number="$(jq -er '.number' <<<"$response")"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "Execução anunciada no issue #$issue_number."

      - name: Assemble and verify harness
        shell: bash
        run: |
          set -euo pipefail
          [ "$SIGE_BASE_URL" = 'https://teste.softgenial.edu.mz' ] || { echo 'Host de staging não autorizado.' >&2; exit 10; }
          umask 077
          root="$RUNNER_TEMP/sige-csp-runtime"
          mkdir -p "$root/tools/csp-runtime-audit" "$root/docs/security" "$SIGE_CSP_OUTPUT"
          cat runtime-harness/lite/audit.part.* > "$root/tools/csp-runtime-audit/audit.mjs"
          node --check "$root/tools/csp-runtime-audit/audit.mjs"
          cat > "$root/tools/csp-runtime-audit/package.json" <<'JSON'
          {
            "name": "sige-csp-runtime-audit",
            "version": "12.14.0",
            "private": true,
            "type": "module",
            "dependencies": { "playwright": "1.49.1" }
          }
          JSON
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(__import__('os').environ['HARNESS_ROOT']) if 'HARNESS_ROOT' in __import__('os').environ else Path(__import__('os').environ['RUNNER_TEMP']) / 'sige-csp-runtime'
          views = [
              'dashboard','turmas','alunos_lista','aluno_portal','disciplinas','matriz','curriculos','boletim','notas','pautas',
              'minhas_turmas','aprovar_notas','auditoria_notas','dec','pauta_final','acta','config','equipe','transporte','portaria',
              'aluno_contas','whatsapp_central','vincular','alocacao','encerramento','abertura','financeiro-dashboard',
              'financeiro-pagamentos','financeiro-extratos','financeiro-gerador','financeiro-inscricoes','financeiro-mpesa',
              'financeiro-config','financeiro-despesas','financeiro-centros','financeiro-devedores','financeiro-lancamentos',
              'financeiro-auditoria','pagamentos-turma','financeiro-relatorio-mensal','financeiro-planos','financeiro-reconciliacao',
              'financeiro-aprovacoes','jardim_diario','jardim_saude','jardim_boletim','jardim_relatorio','jardim_presencas',
              'estatisticas_demo','sige_core_status','sige_permissoes','config_center','privacidade-dados','privacidade-acesso',
              'privacidade-apagamento','privacidade-retencao','whatsapp_diag','whatsapp_circulares','presencas','comunicacoes_central'
          ]
          assert len(views) == 60 and len(set(views)) == 60
          view_doc = {
              'schema_version': 1,
              'release_target': '12.14.0',
              'surface': 'admin-shell',
              'count': 60,
              'standalone_views': ['jardim_boletim'],
              'views': views,
          }
          manifest_doc = {'actions_sha256': '26081f88a5fec7617975389746829ebad9683bfd46e9cabc4e01b40fe922fdd9'}
          (root / 'tools/csp-runtime-audit/views.json').write_text(json.dumps(view_doc, indent=2) + '\n')
          (root / 'docs/security/FRONTEND_ACTION_ALLOWLIST-v12.14.0.json').write_text(json.dumps(manifest_doc, indent=2) + '\n')
          PY
          sha256sum "$root/tools/csp-runtime-audit/audit.mjs" \
                    "$root/tools/csp-runtime-audit/views.json" \
                    "$root/docs/security/FRONTEND_ACTION_ALLOWLIST-v12.14.0.json" \
                    > "$SIGE_CSP_OUTPUT/harness-sha256.txt"
          echo "HARNESS_ROOT=$root" >> "$GITHUB_ENV"

      - name: Validate protected credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGE_ADMIN_USER:-}" ] || [ -z "${SIGE_ADMIN_PASS:-}" ]; then
            echo 'Os Actions secrets SIGE_STAGING_USER e/ou SIGE_STAGING_PASS não estão disponíveis.' >&2
            exit 31
          fi
          echo "::add-mask::$SIGE_ADMIN_USER"
          echo "::add-mask::$SIGE_ADMIN_PASS"
          echo 'Credenciais protegidas disponíveis ao runner.'

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$HARNESS_ROOT/tools/csp-runtime-audit"
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Execute 60 views in cold and warm cache
        id: audit
        shell: bash
        run: |
          set +e
          cd "$HARNESS_ROOT/tools/csp-runtime-audit"
          node audit.mjs 2>&1 | tee "$SIGE_CSP_OUTPUT/audit-console.log"
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Add execution metadata
        if: always()
        shell: bash
        run: |
          mkdir -p "$SIGE_CSP_OUTPUT"
          cat > "$SIGE_CSP_OUTPUT/executor-metadata.json" <<JSON
          {
            "repository": "$GITHUB_REPOSITORY",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_run_attempt": "$GITHUB_RUN_ATTEMPT",
            "commit": "$GITHUB_SHA",
            "staging_origin": "https://teste.softgenial.edu.mz",
            "audit_exit_code": "${{ steps.audit.outputs.exit_code }}"
          }
          JSON

      - name: Publish result to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.announce.outputs.issue_number }}
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        shell: bash
        run: |
          set +e
          decision='not-executed'
          cold='0'
          warm='0'
          cold_violations='-1'
          warm_violations='-1'
          if [ -f "$SIGE_CSP_OUTPUT/enforcement-evidence.json" ]; then
            decision="$(jq -r '.decision // "rejected"' "$SIGE_CSP_OUTPUT/enforcement-evidence.json")"
            cold="$(jq -r '.cold_cache.views_tested // 0' "$SIGE_CSP_OUTPUT/enforcement-evidence.json")"
            warm="$(jq -r '.warm_cache.views_tested // 0' "$SIGE_CSP_OUTPUT/enforcement-evidence.json")"
            cold_violations="$(jq -r '.cold_cache.script_src_violations // -1' "$SIGE_CSP_OUTPUT/enforcement-evidence.json")"
            warm_violations="$(jq -r '.warm_cache.script_src_violations // -1' "$SIGE_CSP_OUTPUT/enforcement-evidence.json")"
          fi
          body="$(cat <<EOF
          Auditoria autenticada CSP da Fase 10.

          - Run: ${GITHUB_RUN_ID}
          - Attempt: ${GITHUB_RUN_ATTEMPT}
          - Commit: ${GITHUB_SHA}
          - Decision: ${decision}
          - Exit code: ${AUDIT_EXIT_CODE:-not-executed}
          - Cold cache: ${cold}/60; script-src=${cold_violations}
          - Warm cache: ${warm}/60; script-src=${warm_violations}
          - Artifact: sige-csp-runtime-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          EOF
          )"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            -d "$payload" >/dev/null
          exit 0

      - name: Upload fail-closed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sige-csp-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce audit result
        if: always()
        shell: bash
        run: |
          code='${{ steps.audit.outputs.exit_code }}'
          [ -n "$code" ] || { echo 'A auditoria não chegou a executar.' >&2; exit 30; }
          exit "$code"
