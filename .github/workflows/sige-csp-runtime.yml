name: SIGE CSP runtime audit

on:
  push:
    branches:
      - SIGE-Mozambique
    paths:
      - .github/workflows/sige-csp-runtime.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: sige-csp-runtime-authenticated
  cancel-in-progress: false

jobs:
  authenticated-csp-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SIGE_BASE_URL: https://teste.softgenial.edu.mz
      SIGE_CSP_OUTPUT: ${{ github.workspace }}/artifacts
      SIGE_CSP_SETTLE_MS: '1200'
      SIGE_CSP_NAV_TIMEOUT_MS: '45000'
    steps:
      - name: Checkout executor
        uses: actions/checkout@v4

      - name: Assemble and verify harness
        shell: bash
        run: |
          set -euo pipefail
          [ "$SIGE_BASE_URL" = 'https://teste.softgenial.edu.mz' ] || { echo 'Host de staging não autorizado.' >&2; exit 10; }
          umask 077
          root="$RUNNER_TEMP/sige-csp-runtime"
          mkdir -p "$root/tools/csp-runtime-audit" "$root/docs/security" "$SIGE_CSP_OUTPUT"
          cat runtime-harness/lite/audit.part.* > "$root/tools/csp-runtime-audit/audit.mjs"
          node --check "$root/tools/csp-runtime-audit/audit.mjs"
          cat > "$root/tools/csp-runtime-audit/package.json" <<'JSON'
          {
            "name": "sige-csp-runtime-audit",
            "version": "12.14.0",
            "private": true,
            "type": "module",
            "dependencies": { "playwright": "1.49.1" }
          }
          JSON
          sha256sum "$root/tools/csp-runtime-audit/audit.mjs" > "$SIGE_CSP_OUTPUT/harness-sha256.txt"
          echo "HARNESS_ROOT=$root" >> "$GITHUB_ENV"

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$HARNESS_ROOT/tools/csp-runtime-audit"
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Open encrypted input channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/sige-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/sige-private.pem -pubout -out /tmp/sige-public.pem >/dev/null 2>&1
          challenge="$(openssl rand -hex 24)"
          printf '%s' "$challenge" > /tmp/sige-challenge
          title="SIGE-CSP-CREDENTIAL-CHANNEL-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo 'Canal criptográfico efémero para a auditoria autenticada do staging SIGE.'
            echo
            echo "Run: ${GITHUB_RUN_ID}; attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "Challenge: ${challenge}"
            echo
            echo 'Aceita apenas um comentário do proprietário com prefixo `CSP_PAYLOAD_V2:`.'
            echo 'A chave privada é exclusiva deste runner e será destruída no final.'
            echo
            echo '```pem'
            cat /tmp/sige-public.pem
            echo '```'
          } > /tmp/sige-issue-body.md
          payload="$(jq -n --arg title "$title" --rawfile body /tmp/sige-issue-body.md '{title:$title,body:$body}')"
          response="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d "$payload")"
          issue_number="$(jq -er '.number' <<<"$response")"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "Canal criado no issue #$issue_number."

      - name: Receive authenticated payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.channel.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          envelope=''
          for _ in $(seq 1 240); do
            response="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100")"
            body="$(jq -r --arg owner "$GITHUB_REPOSITORY_OWNER" \
              '[.[] | select(.user.login == $owner and (.body | startswith("CSP_PAYLOAD_V2:")))] | last // empty | .body // empty' <<<"$response")"
            if [ -n "$body" ]; then
              envelope="${body#CSP_PAYLOAD_V2:}"
              break
            fi
            sleep 5
          done
          [ -n "$envelope" ] || { echo 'Canal expirou sem payload autenticado.' >&2; exit 20; }
          printf '%s' "$envelope" | base64 --decode > /tmp/sige-envelope.json
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const envelope = JSON.parse(fs.readFileSync('/tmp/sige-envelope.json', 'utf8'));
          const privateKey = fs.readFileSync('/tmp/sige-private.pem');
          const key = crypto.privateDecrypt({
            key: privateKey,
            padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
            oaepHash: 'sha256',
          }, Buffer.from(envelope.ek, 'base64'));
          const decipher = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(envelope.iv, 'base64'));
          decipher.setAuthTag(Buffer.from(envelope.tag, 'base64'));
          const plain = Buffer.concat([
            decipher.update(Buffer.from(envelope.ct, 'base64')),
            decipher.final(),
          ]);
          fs.writeFileSync('/tmp/sige-payload.json', plain, { mode: 0o600 });
          NODE
          expected="$(cat /tmp/sige-challenge)"
          actual="$(jq -er '.challenge' /tmp/sige-payload.json)"
          [ "$actual" = "$expected" ] || { echo 'Challenge inválido.' >&2; exit 21; }
          user="$(jq -er '.user' /tmp/sige-payload.json)"
          pass="$(jq -er '.pass' /tmp/sige-payload.json)"
          digest="$(jq -er '.digest' /tmp/sige-payload.json)"
          jq -e '.views | length == 60 and (unique | length == 60)' /tmp/sige-payload.json >/dev/null
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || { echo 'Digest inválido.' >&2; exit 22; }
          echo "::add-mask::$user"
          echo "::add-mask::$pass"
          jq '{schema_version:1,release_target:"12.14.0",surface:"admin-shell",count:(.views|length),standalone_views:["jardim_boletim"],views:.views}' \
            /tmp/sige-payload.json > "$HARNESS_ROOT/tools/csp-runtime-audit/views.json"
          jq -n --arg digest "$digest" '{actions_sha256:$digest}' \
            > "$HARNESS_ROOT/docs/security/FRONTEND_ACTION_ALLOWLIST-v12.14.0.json"
          {
            echo 'SIGE_ADMIN_USER<<__SIGE_USER__'
            echo "$user"
            echo '__SIGE_USER__'
            echo 'SIGE_ADMIN_PASS<<__SIGE_PASS__'
            echo "$pass"
            echo '__SIGE_PASS__'
          } >> "$GITHUB_ENV"
          sha256sum "$HARNESS_ROOT/tools/csp-runtime-audit/views.json" \
                    "$HARNESS_ROOT/docs/security/FRONTEND_ACTION_ALLOWLIST-v12.14.0.json" \
                    >> "$SIGE_CSP_OUTPUT/harness-sha256.txt"
          shred -u /tmp/sige-envelope.json /tmp/sige-payload.json || true

      - name: Execute 60 views in cold and warm cache
        id: audit
        shell: bash
        run: |
          set +e
          cd "$HARNESS_ROOT/tools/csp-runtime-audit"
          node audit.mjs 2>&1 | tee "$SIGE_CSP_OUTPUT/audit-console.log"
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Add execution metadata
        if: always()
        shell: bash
        run: |
          mkdir -p "$SIGE_CSP_OUTPUT"
          cat > "$SIGE_CSP_OUTPUT/executor-metadata.json" <<JSON
          {
            "repository": "$GITHUB_REPOSITORY",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "workflow_run_attempt": "$GITHUB_RUN_ATTEMPT",
            "commit": "$GITHUB_SHA",
            "staging_origin": "https://teste.softgenial.edu.mz",
            "audit_exit_code": "${{ steps.audit.outputs.exit_code }}"
          }
          JSON

      - name: Upload fail-closed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sige-csp-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Close channel and destroy private material
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.channel.outputs.issue_number }}
        shell: bash
        run: |
          set +e
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            curl -sS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
              -d '{"state":"closed","state_reason":"completed"}' >/dev/null
          fi
          shred -u /tmp/sige-private.pem /tmp/sige-public.pem /tmp/sige-challenge 2>/dev/null
          unset SIGE_ADMIN_USER SIGE_ADMIN_PASS
          exit 0

      - name: Enforce audit result
        if: always()
        shell: bash
        run: |
          code='${{ steps.audit.outputs.exit_code }}'
          [ -n "$code" ] || { echo 'A auditoria não chegou a executar.' >&2; exit 30; }
          exit "$code"
